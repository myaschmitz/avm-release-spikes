name: reusable-oidc

# Called by spike-oidc.yml at a branch ref and at a SHA, to compare the OIDC
# job_workflow_ref claim under AVM's custom subject template.

on:
  workflow_call:
    inputs:
      label:
        type: string
        required: true

permissions: {}

jobs:
  claims:
    runs-on: ubuntu-latest
    environment: release-gate
    permissions:
      id-token: write
    steps:
      - shell: bash
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          claims=$(python3 -c 'import sys,base64,json;p=sys.argv[1].split(".")[1];p+="="*(-len(p)%4);c=json.loads(base64.urlsafe_b64decode(p));print(json.dumps({k:c.get(k) for k in ["sub","job_workflow_ref","job_workflow_sha","workflow_ref","ref"]}))' "$tok")
          echo "RESULT|oidc-$LABEL|$claims"
